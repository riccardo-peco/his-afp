<div class="p-4">
  @if (patientManager.apriForm()) {
    <his-accettazione-form
      [selectedPatient]="patientManager.pazienteSelezionato()"
      [showForm]="patientManager.apriForm()"
    >
    </his-accettazione-form>
  } @else {
    <div class="surface-card border-round shadow-1 p-6">
      <h2 class="text-xl font-bold mb-3">Accettazione Paziente</h2>
      <p class="mb-4">
        Effettua prima la ricerca di un paziente su <strong>Ricerca Paziente</strong>.
        Se il paziente è nuovo, usa l'opzione "Nuovo Paziente".
      </p>
    </div>
  }
</div>
